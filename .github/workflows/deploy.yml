name: Deploy Dashboard
on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes (optional)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Dashboard Files
        run: |
          # Create dashboard directory
          mkdir -p dashboard
          
          # Option 1: If files are in the repo
          # cp public.html dashboard/index.html
          # cp public.json dashboard/public.json
          
          # Option 2: Download from external source (your PC)
          # This would require your PC to be accessible or using another method
          echo "Dashboard files need to be provided"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
